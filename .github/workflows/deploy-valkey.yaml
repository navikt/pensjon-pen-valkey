name: Build and deploy Valkey

on:
  push:
    branches:
      - "main"

jobs:
  build:
    name: "build"
    permissions:
      contents: "read"
      id-token: "write"
      packages: "write"
    runs-on: "ubuntu-latest"
    outputs:
      image: "${{ steps.docker-push.outputs.image }}"
      telemetry: "${{ steps.docker-push.outputs.telemetry }}"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # ratchet:actions/checkout@v6
      - uses: nais/docker-build-push@8e41f1f58749b9248e376c25d33bfbdd2b1163c0 # ratchet:nais/docker-build-push@v0
        id: docker-push
        with:
          team: pensjondeployer
          docker_context: .
          dockerfile: Dockerfile
          image_suffix: valkey

  deploy-dev:
    name: "deploy valkey ${{ matrix.env }}"
    permissions:
      contents: "read"
      id-token: "write"
    needs: "build"
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        env: [q0, q1, q2, q5]
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # ratchet:actions/checkout@v6
      - uses: nais/deploy/actions/deploy@849e900e3cfa7faf7ad1532bb3a3e6499c932199 # ratchet:nais/deploy/actions/deploy@v2
        name: "deploy"
        env:
          CLUSTER: "dev-fss"
          IMAGE: "${{ needs.build.outputs.image }}"
          RESOURCE: .nais/valkey-dev.yaml
          VAR: env=${{ matrix.env }}
          TELEMETRY: ${{ needs.build.outputs.telemetry }}

  deploy-prod:
    name: "deploy valkey prod"
    permissions:
      contents: "read"
      id-token: "write"
    needs: ["build"]
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # ratchet:actions/checkout@v6
      - uses: nais/deploy/actions/deploy@849e900e3cfa7faf7ad1532bb3a3e6499c932199 # ratchet:nais/deploy/actions/deploy@v2
        name: "deploy"
        env:
          CLUSTER: "prod-fss"
          IMAGE: "${{ needs.build.outputs.image }}"
          RESOURCE: .nais/valkey-prod.yaml
          TELEMETRY: ${{ needs.build.outputs.telemetry }}
