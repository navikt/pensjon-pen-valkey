name: Build and deploy Valkey

on:
  push:
    branches:
      - "main"

jobs:
  build:
    name: "build"
    permissions:
      contents: "read"
      id-token: "write"
      packages: "write"
    runs-on: "ubuntu-latest"
    outputs:
      image: "${{ steps.docker-push.outputs.image }}"
      telemetry: "${{ steps.docker-push.outputs.telemetry }}"
    steps:
      - uses: "actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10" # ratchet:actions/checkout@v6
      - uses: nais/docker-build-push@05dbb6091b30bd84279c6d64a45ef8782fd410a5 # ratchet:nais/docker-build-push@v0
        id: docker-push
        with:
          team: pensjondeployer
          docker_context: .
          dockerfile: Dockerfile
          image_suffix: valkey

  deploy-dev:
    name: "deploy valkey ${{ matrix.env }}"
    permissions:
      contents: "read"
      id-token: "write"
    needs: "build"
    runs-on: "ubuntu-latest"
    strategy:
      matrix:
        env: [q0, q1, q2, q5]
    steps:
      - uses: "actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10" # ratchet:actions/checkout@v6
      - uses: nais/deploy/actions/deploy@823ec9b7e305ce7cf911d0f9a25f7da9d7486cf2 # ratchet:nais/deploy/actions/deploy@v2
        name: "deploy"
        env:
          CLUSTER: "dev-fss"
          IMAGE: "${{ needs.build.outputs.image }}"
          RESOURCE: .nais/valkey-dev.yaml
          VAR: env=${{ matrix.env }}
          TELEMETRY: ${{ needs.build.outputs.telemetry }}

  deploy-prod:
    name: "deploy valkey prod"
    permissions:
      contents: "read"
      id-token: "write"
    needs: ["build"]
    runs-on: "ubuntu-latest"
    steps:
      - uses: "actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10" # ratchet:actions/checkout@v6
      - uses: nais/deploy/actions/deploy@823ec9b7e305ce7cf911d0f9a25f7da9d7486cf2 # ratchet:nais/deploy/actions/deploy@v2
        name: "deploy"
        env:
          CLUSTER: "prod-fss"
          IMAGE: "${{ needs.build.outputs.image }}"
          RESOURCE: .nais/valkey-prod.yaml
          TELEMETRY: ${{ needs.build.outputs.telemetry }}
